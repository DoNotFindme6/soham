<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050607">
  <meta name="description" content="Coming soon.">
  <title>Coming Soon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body {
      min-height: 100vh;
      overflow: hidden;
      display: grid;
      place-items: center;
      color: #d8d5ce;
      background:
        radial-gradient(ellipse at 50% 54%, rgba(49,53,52,.2) 0%, rgba(12,14,15,.25) 34%, transparent 68%),
        #050607;
      font-family: "Cormorant Garamond", Georgia, serif;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .12;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.38'/%3E%3C/svg%3E");
    }
    .frame {
      position: relative;
      width: min(900px, calc(100% - 48px));
      min-height: 80vh;
      display: grid;
      place-items: center;
      text-align: center;
    }
    .frame::before, .frame::after {
      content: "";
      position: absolute;
      width: min(62vw, 510px);
      aspect-ratio: 1;
      border: 1px solid rgba(190,185,170,.055);
      border-radius: 50%;
      animation: breathe 9s ease-in-out infinite;
    }
    .frame::after {
      width: min(45vw, 365px);
      border-color: rgba(190,185,170,.045);
      animation-delay: -4.5s;
    }
    .content { position: relative; z-index: 1; padding: 30px 0; }
    .mark {
      width: 5px;
      height: 5px;
      margin: 0 auto 34px;
      border-radius: 50%;
      background: #77766e;
      box-shadow: 0 0 22px 5px rgba(150,145,127,.14);
      animation: pulse 4s ease-in-out infinite;
    }
    h1 {
      margin: 0;
      color: #d8d5ce;
      font-weight: 400;
      font-size: clamp(54px, 9vw, 94px);
      line-height: 1;
      letter-spacing: .13em;
      text-indent: .13em;
      text-transform: uppercase;
    }
    .rule {
      width: 54px;
      height: 1px;
      margin: 34px auto 26px;
      background: linear-gradient(90deg, transparent, rgba(178,169,147,.55), transparent);
    }
    p {
      margin: 0;
      color: #777873;
      font-family: "DM Mono", monospace;
      font-size: 9px;
      letter-spacing: .38em;
      line-height: 1.8;
      text-transform: uppercase;
    }
    @keyframes pulse {
      0%, 100% { opacity: .45; box-shadow: 0 0 14px 3px rgba(150,145,127,.1); }
      50% { opacity: 1; box-shadow: 0 0 27px 8px rgba(150,145,127,.2); }
    }
    @keyframes breathe {
      0%, 100% { transform: scale(.96); opacity: .55; }
      50% { transform: scale(1.04); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
    }
  </style>
</head>
<body>
  <main class="frame">
    <div class="content">
      <div class="mark" aria-hidden="true"></div>
      <h1>Coming Soon</h1>
      <div class="rule"></div>
      <p>Something is approaching</p>
    </div>
  </main>
</body>
</html>
