<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#020205">
  <meta name="description" content="Coming soon.">
  <title>Coming Soon</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body {
      min-height: 100svh;
      overflow: hidden;
      display: grid;
      place-items: center;
      background: #020205;
      color: #e8e4df;
      font-family: Georgia, 'Times New Roman', serif;
    }
    #space { position: fixed; inset: 0; width: 100%; height: 100%; opacity: .8; }
    .nebula {
      position: fixed; inset: -20%; pointer-events: none;
      background:
        radial-gradient(ellipse at 50% 47%, rgba(71,55,105,.13), transparent 27%),
        radial-gradient(ellipse at 48% 52%, rgba(24,62,91,.10), transparent 42%),
        radial-gradient(ellipse at 50% 50%, transparent 20%, rgba(0,0,0,.68) 75%);
      filter: blur(18px);
    }
    .scene {
      position: relative;
      width: min(760px, 100vw);
      height: min(760px, 100svh);
      display: grid;
      place-items: center;
      isolation: isolate;
    }
    .black-hole {
      position: absolute;
      width: min(67vw, 490px);
      aspect-ratio: 1;
      top: 43%; left: 50%;
      transform: translate(-50%, -50%);
      filter: drop-shadow(0 0 45px rgba(129,105,178,.18));
    }
    .disk {
      position: absolute;
      left: 50%; top: 50%;
      width: 100%; height: 34%;
      border-radius: 50%;
      transform: translate(-50%, -50%) rotate(-13deg);
      background: conic-gradient(from 0deg,
        transparent 0 7%, rgba(93,130,190,.10) 10%, rgba(174,133,220,.92) 17%,
        rgba(255,218,181,.95) 22%, rgba(255,255,255,.82) 25%,
        rgba(116,151,216,.62) 31%, transparent 39% 54%,
        rgba(105,119,185,.24) 63%, rgba(226,160,119,.86) 72%,
        rgba(255,222,190,.94) 77%, rgba(142,133,209,.45) 83%, transparent 92%);
      filter: blur(5px);
      box-shadow: 0 0 25px rgba(181,145,223,.32), 0 0 70px rgba(93,126,190,.17);
      animation: disk-spin 18s linear infinite;
    }
    .disk::before {
      content: ''; position: absolute; inset: 13% 3%; border-radius: 50%;
      border: 2px solid rgba(255,220,194,.65);
      filter: blur(3px);
    }
    .disk-back {
      height: 28%; opacity: .68; transform: translate(-50%, -50%) rotate(167deg) scaleY(.8);
      filter: blur(9px); animation: disk-spin-back 26s linear infinite;
    }
    .lensing {
      position: absolute; inset: 12%; border-radius: 50%;
      border: 1px solid rgba(190,166,230,.34);
      box-shadow: 0 0 14px rgba(167,140,223,.34), inset 0 0 18px rgba(151,137,215,.17);
      transform: scaleY(.45) rotate(-13deg);
      animation: lens-pulse 7s ease-in-out infinite;
    }
    .core {
      position: absolute; left: 50%; top: 50%;
      width: 37%; aspect-ratio: 1; border-radius: 50%;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle at 43% 38%, #000 0 48%, #010104 66%, rgba(1,1,5,.82) 75%, transparent 78%);
      box-shadow: 0 0 0 9px rgba(3,3,8,.86), 0 0 28px 12px rgba(0,0,0,.98), 0 0 54px 12px rgba(0,0,0,.9);
      z-index: 2;
    }
    .core::after {
      content: ''; position: absolute; inset: -13%; border-radius: 50%;
      border: 1px solid rgba(219,199,255,.18);
      box-shadow: 0 0 18px rgba(166,140,220,.15);
    }
    .accretion-glow {
      position: absolute; inset: 2%; border-radius: 50%;
      background: radial-gradient(ellipse, transparent 27%, rgba(116,91,173,.10) 38%, transparent 62%);
      filter: blur(12px); animation: glow 6s ease-in-out infinite;
    }
    .message {
      position: absolute; z-index: 5; top: 77%; left: 50%;
      transform: translateX(-50%); width: 100%; text-align: center;
      padding: 0 18px;
    }
    h1 {
      margin: 0; font-weight: 400; font-size: clamp(30px, 5.8vw, 58px);
      letter-spacing: .24em; text-indent: .24em; text-transform: uppercase;
      color: rgba(237,233,239,.92);
      text-shadow: 0 0 24px rgba(179,155,220,.18);
    }
    @keyframes disk-spin { from { rotate: 0deg; } to { rotate: 360deg; } }
    @keyframes disk-spin-back { from { rotate: 0deg; } to { rotate: -360deg; } }
    @keyframes lens-pulse { 0%,100% { opacity: .55; transform: scaleY(.43) rotate(-13deg); } 50% { opacity: 1; transform: scaleY(.49) rotate(-13deg); } }
    @keyframes glow { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
    @media (max-width: 560px) {
      .scene { height: 88svh; }
      .black-hole { width: min(88vw, 440px); top: 42%; }
      .message { top: 75%; }
      h1 { letter-spacing: .17em; text-indent: .17em; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>
  <canvas id="space" aria-hidden="true"></canvas>
  <div class="nebula" aria-hidden="true"></div>
  <main class="scene">
    <div class="black-hole" aria-hidden="true">
      <div class="accretion-glow"></div>
      <div class="disk disk-back"></div>
      <div class="lensing"></div>
      <div class="disk"></div>
      <div class="core"></div>
    </div>
    <div class="message"><h1>Coming Soon</h1></div>
  </main>
  <script>
    (() => {
      const canvas = document.getElementById('space');
      const ctx = canvas.getContext('2d');
      const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      let w = 0, h = 0, stars = [], motes = [], frame = 0;
      const rand = (a,b) => a + Math.random() * (b-a);
      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        w = window.innerWidth; h = window.innerHeight;
        canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
        ctx.setTransform(dpr,0,0,dpr,0,0);
        stars = Array.from({length: Math.min(230, Math.floor(w*h/5200))}, () => ({x:rand(0,w), y:rand(0,h), r:rand(.35,1.25), a:rand(.15,.75), p:rand(0,Math.PI*2)}));
        motes = Array.from({length: 46}, () => ({a:rand(0,Math.PI*2), r:rand(75,Math.min(w,h)*.36), s:rand(.001,.004), z:rand(.5,1.8)}));
      }
      function draw() {
        ctx.clearRect(0,0,w,h);
        for (const s of stars) {
          const twinkle = reduce ? 1 : .68 + Math.sin(frame*.018+s.p)*.32;
          ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
          ctx.fillStyle = `rgba(220,220,240,${s.a*twinkle})`; ctx.fill();
        }
        const cx=w/2, cy=h*.43;
        for (const m of motes) {
          if (!reduce) m.a += m.s;
          const x=cx+Math.cos(m.a)*m.r, y=cy+Math.sin(m.a)*m.r*.34;
          ctx.beginPath(); ctx.arc(x,y,m.z,0,Math.PI*2);
          ctx.fillStyle = `rgba(188,166,226,${.18 + .25*Math.sin(m.a*2)**2})`; ctx.fill();
        }
        frame++;
        if (!reduce) requestAnimationFrame(draw);
      }
      window.addEventListener('resize', resize, {passive:true});
      resize(); draw();
    })();
  </script>
</body>
</html>
