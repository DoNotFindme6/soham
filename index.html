<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050806">
<meta name="description" content="Soham Shetty — technology, ideas, and projects.">
<title>Soham Shetty — Technology & Ideas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#101713;--panel:#17211b;--panel2:#1c2921;--ink:#edf1e9;--muted:#a2afa3;--lime:#b6d77a;--line:rgba(220,235,218,.13);--red:#e46c55;--amber:#e8b96d}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.6}
body.locked{overflow:hidden;background:#030504}
a{color:inherit;text-decoration:none}.wrap{width:min(1120px,calc(100% - 48px));margin:auto}
header{height:78px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.brand{font-weight:750;letter-spacing:-.04em;font-size:1.05rem}.brand span{color:var(--lime)}
nav{display:flex;gap:30px;color:var(--muted);font-size:.88rem}nav a:hover{color:var(--lime)}
.kicker{color:var(--lime);text-transform:uppercase;letter-spacing:.18em;font-size:.72rem;font-weight:700}
h1,h2,h3,p{margin-top:0}h1{font-size:clamp(3.1rem,7vw,6.2rem);line-height:.96;letter-spacing:-.075em;margin:20px 0 24px;font-weight:760}
h1 em{font-style:normal;color:var(--lime)}
.hero{padding:90px 0 78px;display:grid;grid-template-columns:1.35fr .9fr;gap:56px;align-items:center}.hero p{max-width:610px;color:var(--muted);font-size:1.15rem}
.portrait{position:relative;border:1px solid var(--line);background:var(--panel);padding:14px}
.portrait img{display:block;width:100%;height:auto;aspect-ratio:4/5;object-fit:cover;filter:saturate(.95) contrast(1.02)}
.portrait figcaption{display:flex;justify-content:space-between;font:.72rem "JetBrains Mono","SFMono-Regular",monospace;color:var(--muted);padding:12px 4px 2px}
.portrait figcaption b{color:var(--lime);font-weight:600}
.hero-links{display:flex;gap:14px;flex-wrap:wrap;margin-top:32px}.pill{display:inline-flex;padding:11px 17px;border:1px solid var(--line);border-radius:4px;font-size:.88rem}.pill.primary{background:var(--lime);color:#152017;border-color:var(--lime);font-weight:700}
main section{padding:76px 0;border-top:1px solid var(--line)}.section-head{display:flex;justify-content:space-between;gap:30px;align-items:end;margin-bottom:34px}.section-head h2{font-size:clamp(2rem,4vw,3.4rem);letter-spacing:-.06em;line-height:1;margin:10px 0 0}.section-index{color:var(--muted);font: .8rem "JetBrains Mono","SFMono-Regular",monospace}
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:70px}.about-grid p{color:var(--muted);font-size:1.05rem}.about-grid p strong{color:var(--ink);font-weight:600}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin-top:44px}
.fact{background:var(--bg);padding:20px 22px}.fact small{display:block;color:var(--muted);font:.68rem "JetBrains Mono",monospace;text-transform:uppercase;letter-spacing:.12em}.fact span{display:block;margin-top:6px;font-weight:600}
.interests{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.interest{background:var(--panel);padding:24px;border:1px solid var(--line);min-height:145px}.interest small{color:var(--lime);font: .72rem "JetBrains Mono","SFMono-Regular",monospace}.interest h3{margin:19px 0 5px;font-size:1.05rem}.interest p{color:var(--muted);font-size:.88rem;margin:0}
.projects{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.project{background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;transition:border-color .25s,transform .25s}.project:hover{border-color:rgba(182,215,122,.45);transform:translateY(-3px)}
.project svg{display:block;width:100%;height:auto;border-bottom:1px solid var(--line)}
.project-body{padding:22px 22px 24px}.project-body small{color:var(--lime);font:.7rem "JetBrains Mono",monospace;letter-spacing:.08em}.project-body h3{margin:10px 0 6px;font-size:1.15rem}.project-body p{color:var(--muted);font-size:.9rem;margin:0}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}.tags span{font:.68rem "JetBrains Mono",monospace;color:var(--muted);border:1px solid var(--line);padding:3px 8px;border-radius:3px}
.timeline{display:grid;gap:0;border-left:1px solid var(--line);margin-left:6px}
.tl{position:relative;padding:0 0 30px 32px}.tl:before{content:"";position:absolute;left:-6px;top:6px;width:11px;height:11px;border-radius:50%;background:var(--bg);border:2px solid var(--lime)}
.tl small{color:var(--lime);font:.75rem "JetBrains Mono",monospace}.tl h3{margin:4px 0 4px;font-size:1.05rem}.tl p{color:var(--muted);margin:0;font-size:.92rem;max-width:620px}
.gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.gallery figure{margin:0;background:var(--panel);border:1px solid var(--line)}.gallery svg{display:block;width:100%;height:auto}
.gallery figcaption{padding:12px 14px;color:var(--muted);font-size:.82rem}
.note{border:1px solid var(--line);background:var(--panel);padding:25px 28px;color:var(--muted)}.note strong{color:var(--ink)}
.review{background:#151c17;border:1px solid rgba(228,108,85,.25);padding:clamp(24px,5vw,54px);position:relative}.review-top{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap;color:var(--amber);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase}.stars{color:var(--red);letter-spacing:.16em}.review h3{font-size:clamp(1.7rem,4vw,2.7rem);line-height:1.08;letter-spacing:-.055em;margin:24px 0 22px;max-width:720px}.review-body{max-width:790px;color:#c0c8be}.review-body p{margin:0 0 18px}.review-body h4{color:var(--ink);margin:30px 0 12px;font-size:1.08rem}.review-body strong{color:var(--ink)}.verdict{border-top:1px solid var(--line);padding-top:22px;margin-top:28px;color:var(--ink)}.score{font-size:2.5rem;font-weight:800;letter-spacing:-.06em;color:var(--red);margin-top:12px}
.contact{display:flex;justify-content:space-between;gap:30px;align-items:center}.contact p{color:var(--muted);max-width:520px;margin:12px 0 0}.contact-links{display:flex;gap:10px;flex-wrap:wrap}
footer{padding:30px 0 42px;color:#7e8b80;font-size:.78rem;display:flex;justify-content:space-between;gap:15px;border-top:1px solid var(--line)}
@media(max-width:900px){.hero{grid-template-columns:1fr;gap:36px}.portrait{max-width:420px}.projects{grid-template-columns:1fr}.gallery{grid-template-columns:repeat(2,1fr)}.facts{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){.wrap{width:min(100% - 34px,1120px)}header{height:68px}nav{gap:14px;font-size:.78rem}nav a:nth-child(2){display:none}.hero{padding:60px 0 58px}.about-grid{grid-template-columns:1fr;gap:12px}.interests{grid-template-columns:1fr}.section-head{align-items:start}.contact{display:block}.contact-links{margin-top:20px}footer{display:block}footer span{display:block;margin-top:8px}}

/* ============ COUNTDOWN GATE ============ */
#gate{position:fixed;inset:0;z-index:100;background:#030504;color:#dfe8da;display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:"Cinzel",Georgia,serif}
#gate canvas{position:absolute;inset:0;width:100%;height:100%}
.g-bg{position:absolute;inset:-10%;background:
  radial-gradient(ellipse 60% 45% at 50% 55%,rgba(60,110,60,.35),transparent 70%),
  radial-gradient(ellipse 90% 70% at 50% 120%,rgba(20,60,30,.6),transparent 70%),
  repeating-linear-gradient(45deg,rgba(255,255,255,.018) 0 2px,transparent 2px 6px),
  repeating-linear-gradient(-45deg,rgba(255,255,255,.018) 0 2px,transparent 2px 6px);
  animation:breathe 14s ease-in-out infinite alternate}
@keyframes breathe{from{transform:scale(1)}to{transform:scale(1.08)}}
.g-vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 35%,rgba(0,0,0,.92) 100%);pointer-events:none}
.g-scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.25) 0 1px,transparent 1px 3px);mix-blend-mode:multiply;pointer-events:none;opacity:.6}
.g-bars:before,.g-bars:after{content:"";position:absolute;left:0;right:0;height:9vh;background:#000;z-index:3}.g-bars:before{top:0}.g-bars:after{bottom:0}
.g-inner{position:relative;z-index:2;text-align:center;padding:0 20px;width:100%}
.g-pre{font-family:"JetBrains Mono",monospace;font-size:clamp(.62rem,1.4vw,.78rem);letter-spacing:.5em;color:#8fae86;text-transform:uppercase;opacity:0;animation:fadeIn 2.5s 0.4s forwards}
.g-title{margin:18px 0 6px;font-weight:900;font-size:clamp(2.6rem,9vw,7.5rem);line-height:.9;letter-spacing:.06em;
  background:linear-gradient(180deg,#f5faf0 0%,#c4d6bb 38%,#4f6a4f 50%,#a9c39c 62%,#e9f3e2 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 28px rgba(120,200,110,.28));opacity:0;animation:rise 3s 1s cubic-bezier(.2,.7,.2,1) forwards}
.g-sub{font-weight:500;letter-spacing:.9em;font-size:clamp(.8rem,2vw,1.15rem);color:#9db894;margin-right:-.9em;opacity:0;animation:fadeIn 2s 2.4s forwards}
.g-line{height:1.6em;margin:34px 0 28px;font-family:"JetBrains Mono",monospace;font-size:clamp(.72rem,1.7vw,.92rem);letter-spacing:.28em;text-transform:uppercase;color:#cfe0c6}
.g-line span{display:inline-block;transition:opacity .9s,filter .9s,letter-spacing .9s}
.g-line span.out{opacity:0;filter:blur(6px);letter-spacing:.6em}
.clock{display:flex;justify-content:center;align-items:flex-start;gap:clamp(8px,2.4vw,28px);opacity:0;animation:fadeIn 2s 3s forwards}
.unit{min-width:clamp(62px,13vw,150px)}
.num{display:block;font-weight:700;font-size:clamp(2.6rem,9.5vw,7rem);line-height:1;font-variant-numeric:tabular-nums;
  background:linear-gradient(180deg,#ffffff 0%,#b9cdb0 45%,#3d553e 52%,#93ad88 70%,#e4eedd 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 18px rgba(130,210,120,.35))}
.num.tick{animation:tick .55s ease-out}
@keyframes tick{0%{filter:drop-shadow(0 0 40px rgba(170,255,150,.9)) brightness(1.6);transform:scale(1.04)}100%{filter:drop-shadow(0 0 18px rgba(130,210,120,.35));transform:scale(1)}}
.lbl{display:block;margin-top:10px;font-family:"JetBrains Mono",monospace;font-size:clamp(.55rem,1.2vw,.7rem);letter-spacing:.4em;color:#7f9b78;text-transform:uppercase}
.sep{font-size:clamp(2rem,7vw,5.4rem);line-height:1;color:#3e5a3f;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.g-date{margin-top:38px;font-family:"JetBrains Mono",monospace;font-size:clamp(.6rem,1.3vw,.75rem);letter-spacing:.55em;color:#6f8a69;opacity:0;animation:fadeIn 2s 3.6s forwards}
.g-date b{color:#b6d77a;font-weight:600}
@keyframes fadeIn{to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.97);letter-spacing:.3em}to{opacity:1;transform:none;letter-spacing:.06em}}
#gate.final .g-inner{animation:shake .12s infinite}
#gate.final .num{filter:drop-shadow(0 0 30px rgba(220,80,60,.6));background-image:linear-gradient(180deg,#fff,#f0b9a8 45%,#6a2a20 52%,#e88a72 70%,#ffe9e1);-webkit-background-clip:text;background-clip:text;color:transparent}
@keyframes shake{0%{transform:translate(0,0)}25%{transform:translate(1.5px,-1px)}50%{transform:translate(-1px,1.5px)}75%{transform:translate(1px,1px)}}
.flash{position:absolute;inset:0;background:radial-gradient(circle,#f4ffe8,#b6d77a 40%,transparent 75%);opacity:0;z-index:5;pointer-events:none}
#gate.open .flash{animation:flash 1.6s ease-out forwards}
#gate.open .g-inner{animation:zoomOut 1.2s ease-in forwards}
#gate.gone{opacity:0;transition:opacity 1.2s ease;pointer-events:none}
@keyframes flash{0%{opacity:0}15%{opacity:1}100%{opacity:0}}
@keyframes zoomOut{to{transform:scale(2.4);opacity:0;filter:blur(8px)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important;animation-duration:.01s!important;animation-delay:0s!important}}
</style>
</head>

<section id="about">
  <div class="section-head"><div><div class="kicker">01 / About</div><h2>A little context.</h2></div><div class="section-index">PROFILE</div></div>
  <div class="about-grid">
    <p>Soham grew up in Mangaluru, within earshot of the Arabian Sea and a family that argued about everything at dinner. He studied computer science, moved to Bengaluru, and now spends his days as a <strong>backend engineer at an early-stage fintech</strong>, building the boring, reliable plumbing that makes money move.</p>
    <p>Outside work, the focus is on <strong>learning, building and asking better questions</strong>: small products that solve one real problem, a newsletter that tries to explain technology without hype, and a long-running belief that good writing and good code come from the same place: clear thinking.</p>
  </div>

<section id="review">
  <div class="section-head"><div><div class="kicker">06 / A considered opinion</div><h2>One review. No mercy.</h2></div><div class="section-index">BOOK REVIEW</div></div>
  <article class="review">
    <div class="review-top"><span>Book Review · Soham Shetty</span><span class="stars">★★★★★</span></div>
    <h3>Rangers of the Wild: An Exercise in Mediocrity</h3>
    <div class="review-body">
      <p>There are few things more disappointing than a book that takes an inherently fascinating subject and somehow makes it excruciatingly boring. <em>Rangers of the Wild</em> manages this with remarkable consistency.</p>
      <p>Wildlife conservation is an extraordinary subject. India's biodiversity, endangered species, ecological challenges and conservation efforts offer practically limitless opportunities for compelling storytelling. Yet this book seems determined to avoid every single one of them.</p>
      <p>The writing is painfully generic. Paragraph after paragraph feels assembled from the most predictable sentences imaginable. There is little personality, little originality and very little that makes the reader want to turn another page. At times, the prose has the unmistakable flavour of AI-generated filler: technically coherent sentences arranged into paragraphs that ultimately say very little.</p>
      <p>The book also suffers from an abundance of fluff. It repeatedly circles around obvious observations, dressing up relatively basic ideas in language that seems designed to sound more profound than it actually is. There is a difference between communicating an important message and endlessly repeating it. Unfortunately, <em>Rangers of the Wild</em> appears unfamiliar with that distinction.</p>
      <p>And perhaps its greatest offence is how utterly uninteresting it becomes. Conservation should inspire curiosity. It should make readers appreciate the complexity of ecosystems, the challenges facing wildlife and the people dedicating their lives to protecting it. Instead, the experience feels like reading an extended school assignment written by someone who would rather be doing absolutely anything else.</p>
      <p>A worthwhile book needs more than a worthy subject. It needs research, insight, structure, personality and, most importantly, something meaningful to say. Simply mentioning wildlife, conservation and environmental responsibility does not magically produce good literature.</p>
      <h4>The unfortunate business of sharing a name</h4>
      <p>Perhaps the most personally offensive aspect of this entire experience is that the author and I share a name.</p>
      <p>As Soham Shetty, I find myself in the deeply unfortunate position of having to clarify that we are two very different standards of Soham Shetty. I take some pride in my own intellectual standards, interests and appreciation for quality. Having my name associated with a book of this calibre is an unfortunate branding exercise.</p>
      <p>I would rather not be mistaken for someone whose literary ambitions appear to have peaked at putting generic conservation observations between two covers.</p>
      <p>There is only room for one Soham Shetty with functioning literary standards, and I am certainly not surrendering that title.</p>
      <p><strong>I am the better Soham. The book is the evidence.</strong></p>
      <div class="verdict"><strong>Final verdict:</strong> A potentially fascinating subject buried beneath generic prose, unnecessary padding and an astonishing lack of narrative energy. It reads like an AI prompt that was never properly edited, let alone transformed into a compelling book.<p>The wildlife deserves better. The readers deserve better. Even the tiger on the cover deserves better.</p><div class="score">0 / 5</div><strong>Would not recommend.</strong></div>
    </div>
  </article>
</section>

<script>
(function(){
  // Opens at 00:00 IST, 28 Nov 2026  (= 18:30 UTC, 27 Nov 2026)
  var OPEN_AT = Date.UTC(2026, 10, 27, 18, 30, 0);
  // Test hook: add ?countdown=10 to the URL to preview a 10-second countdown + reveal.
  var q = new URLSearchParams(location.search);
  if (q.has('countdown')) OPEN_AT = Date.now() + (parseInt(q.get('countdown'),10) || 10) * 1000;

  var gate = document.getElementById('gate');
  function mountSite(){
    var tpl = document.getElementById('site-tpl');
    document.getElementById('site').appendChild(tpl.content.cloneNode(true));
    var y = document.getElementById('year'); if (y) y.textContent = new Date().getFullYear();
    document.body.classList.remove('locked');
  }

  if (Date.now() >= OPEN_AT) { gate.remove(); mountSite(); return; }

  // ---- countdown ----
  var els = {d:document.getElementById('d'),h:document.getElementById('h'),m:document.getElementById('m'),s:document.getElementById('s')};
  var prev = {};
  function pad(n){ return (n < 10 ? '0' : '') + n; }
  function set(k, v){
    if (prev[k] === v) return; prev[k] = v;
    var el = els[k]; el.textContent = v;
    el.classList.remove('tick'); void el.offsetWidth; el.classList.add('tick');
  }
  var opened = false;
  function tick(){
    var diff = OPEN_AT - Date.now();
    if (diff <= 0) { set('d','00'); set('h','00'); set('m','00'); set('s','00'); reveal(); return; }
    var t = Math.floor(diff / 1000);
    set('d', pad(Math.floor(t / 86400)));
    set('h', pad(Math.floor(t % 86400 / 3600)));
    set('m', pad(Math.floor(t % 3600 / 60)));
    set('s', pad(t % 60));
    gate.classList.toggle('final', t < 10);
    setTimeout(tick, (diff % 1000) + 10);
  }
  function reveal(){
    if (opened) return; opened = true;
    gate.classList.remove('final');
    gate.classList.add('open');
    mountSite();
    setTimeout(function(){ gate.classList.add('gone'); }, 900);
    setTimeout(function(){ gate.remove(); }, 2200);
  }
  tick();

  // ---- rotating teaser lines ----
  var lines = ['Two of us share a name.','Only one kept his standards.','One book. One verdict.','The reckoning is scheduled.','There can be only one.'];
  var li = 0, lineEl = document.getElementById('gline');
  setInterval(function(){
    lineEl.classList.add('out');
    setTimeout(function(){ li = (li + 1) % lines.length; lineEl.textContent = lines[li]; lineEl.classList.remove('out'); }, 900);
  }, 4200);

  // ---- embers ----
  var c = document.getElementById('embers'), ctx = c.getContext('2d'), W, H, P = [];
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function size(){ W = c.width = innerWidth * devicePixelRatio; H = c.height = innerHeight * devicePixelRatio; }
  size(); addEventListener('resize', size);
  function spawn(){ return {x:Math.random()*W, y:H + Math.random()*H*.3, r:(Math.random()*1.8+.4)*devicePixelRatio, v:(Math.random()*.6+.25)*devicePixelRatio, w:Math.random()*Math.PI*2, a:Math.random()*.6+.2}; }
  for (var i = 0; i < 90; i++){ var p = spawn(); p.y = Math.random()*H; P.push(p); }
  function draw(){
    if (!document.body.contains(c)) return;
    ctx.clearRect(0,0,W,H);
    for (var i = 0; i < P.length; i++){
      var p = P[i]; p.y -= p.v; p.w += .02; p.x += Math.sin(p.w) * .4 * devicePixelRatio;
      if (p.y < -10) P[i] = spawn();
      var hot = gate.classList.contains('final');
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7);
      ctx.fillStyle = hot ? 'rgba(240,120,90,' + p.a + ')' : 'rgba(170,230,140,' + p.a + ')';
      ctx.shadowColor = hot ? '#e46c55' : '#9fe07a'; ctx.shadowBlur = 8 * devicePixelRatio;
      ctx.fill();
    }
    requestAnimationFrame(draw);
  }
  if (!reduce) draw();
})();
